name: Validate IETF Draft XML/MD

on:
  workflow_dispatch:

jobs:
  xml2rfc-validate:
    name: xml2rfc lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: pip install xml2rfc && xml2rfc --version

      - name: Test draft-pqchc-01 (no --quiet)
        run: |
          xml2rfc draft-vicente-lamps-pqchc-01.xml --text --out /dev/null
          echo "Exit: $?"

      - name: Test rotation-envelope-02 (no --quiet)
        run: |
          xml2rfc draft-vicente-lamps-rotation-envelope-02.xml --text --out /dev/null
          echo "Exit: $?"

      - name: Test draft-pqchc-02 (fixed, no --quiet)
        run: |
          xml2rfc draft-vicente-lamps-pqchc-02.xml --text --out /dev/null
          echo "Exit: $?"

      - name: Test with --quiet flag
        run: |
          xml2rfc --quiet draft-vicente-lamps-pqchc-01.xml --text --out /dev/null
          echo "Exit with --quiet: $?"
