name: Validate IETF Draft XML/MD

on:
  workflow_dispatch:

jobs:
  xml2rfc-validate:
    name: xml2rfc lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: |
          pip install xml2rfc
          xml2rfc --version

      - name: Diagnose xml2rfc failure on pqchc-01
        run: |
          set +e
          xml2rfc draft-vicente-lamps-pqchc-01.xml --text --out /dev/null 2>&1
          echo "EXIT_CODE: $?"
          echo "---"
          xml2rfc --verbose draft-vicente-lamps-pqchc-01.xml --text --out /dev/null 2>&1 | head -50
          echo "EXIT_CODE_VERBOSE: $?"
