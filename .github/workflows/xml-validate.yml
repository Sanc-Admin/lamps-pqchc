name: Validate IETF Draft XML/MD

on:
  workflow_dispatch:

jobs:
  xml2rfc-validate:
    name: xml2rfc lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: pip install xml2rfc && xml2rfc --version >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose all XML files
        run: |
          set +e
          {
            echo "## xml2rfc diagnostic"
            for f in $(find . -name 'draft-*.xml' -not -path './.git/*'); do
              echo ""
              echo "### File: $f"
              echo '```'
              xml2rfc "$f" --text --out /dev/null 2>&1
              echo "EXIT=$?"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: xml2rfc-diagnostic
          path: /home/runner/work/_temp/_runner_file_commands/step_summary_*
          if-no-files-found: warn
