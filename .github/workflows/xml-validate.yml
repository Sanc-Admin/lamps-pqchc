name: Validate IETF Draft XML/MD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xml2rfc-validate:
    name: xml2rfc lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: pip install xml2rfc

      - name: Diagnose all XML files
        run: |
          set +e
          outfile=xml2rfc_diagnostic.txt
          {
            echo "xml2rfc diagnostic $(date -u)"
            echo "=========================="
            xml2rfc --version
            echo ""
            for f in $(find . -name 'draft-*.xml' -not -path './.git/*'); do
              echo ""
              echo "FILE: $f"
              echo "---"
              xml2rfc "$f" --text --out /dev/null 2>&1
              echo "EXIT=$?"
              echo "---"
            done
          } | tee "$outfile"
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xml2rfc_diagnostic.txt
          git commit -m "debug: xml2rfc diagnostic output" || echo "nothing to commit"
          git push
