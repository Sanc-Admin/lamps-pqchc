name: Validate IETF Draft XML/MD

on:
  workflow_dispatch:

jobs:
  xml2rfc-validate:
    name: xml2rfc lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xml2rfc
        run: |
          pip install xml2rfc
          xml2rfc --version

      - name: Diagnose pqchc-01 (capture all output)
        run: |
          set +e
          echo "=== STDOUT ==="
          xml2rfc draft-vicente-lamps-pqchc-01.xml --text --out /dev/null > /tmp/out.txt 2>&1
          EC=$?
          cat /tmp/out.txt
          echo ""
          echo "=== EXIT CODE: $EC ==="
          exit 0

      - name: Diagnose rotation-envelope-02 (capture all output)
        run: |
          set +e
          echo "=== STDOUT ==="
          xml2rfc draft-vicente-lamps-rotation-envelope-02.xml --text --out /dev/null > /tmp/out2.txt 2>&1
          EC=$?
          cat /tmp/out2.txt
          echo ""
          echo "=== EXIT CODE: $EC ==="
          exit 0
