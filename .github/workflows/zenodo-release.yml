name: Zenodo Release on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  zenodo-archive:
    name: Verify Zenodo metadata on tag push
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v7

      - name: Verify .zenodo.json
        run: |
          if [ ! -f .zenodo.json ]; then
            echo "ERROR: .zenodo.json not found"
            exit 1
          fi
          python3 -m json.tool .zenodo.json > /dev/null && echo "PASS: .zenodo.json valid"

      - name: Verify CITATION.cff
        run: |
          [ -f CITATION.cff ] && echo "PASS: CITATION.cff present" || echo "WARN: CITATION.cff missing"

      - name: Tag summary
        run: echo "Tag ${GITHUB_REF_NAME} pushed — verify Zenodo at https://zenodo.org/search?q=${GITHUB_REPOSITORY##*/}"
